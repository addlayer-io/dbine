# Dependency updates as pull requests, grouped so each ecosystem opens at
# most one PR a week. Security fixes come as their own PRs when Dependabot
# security updates are on (Settings › Code security). The actions are pinned
# by commit SHA; Dependabot moves the SHA and the version comment together.
# Major versions of Cargo and npm packages are left out: those upgrades are
# planned by hand (security fixes still come, whatever the version).
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/driver-hosts"]
    schedule: { interval: weekly, day: monday }
    ignore:
      # tauri-action 1.x renames the macOS updater bundle and changes how
      # releases are edited: a planned migration of release.yml, not a bump.
      - dependency-name: tauri-apps/tauri-action
        update-types: ["version-update:semver-major"]
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: cargo
    directories: ["/", "/mobile/src-tauri"]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: ["/web", "/mobile"]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor:
        update-types: [minor, patch]
