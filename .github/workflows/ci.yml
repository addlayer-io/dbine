name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand (Actions → CI → Run workflow), e.g. to check a fix to this file.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      # One test binary per driver crate: without debug info they fit on the
      # runner's disk (with it, linking ran out of space). CI only; release
      # builds are unaffected.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      # The runner ships toolchains DBine doesn't use; they take ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev \
            libkrb5-dev  # Kerberos (GSSAPI) for Windows authentication: SQL Server, MongoDB

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend (type-check + build)
        run: |
          npm ci --prefix web
          npm run build --prefix web

      # Unit tests only: integration tests need real servers and are #[ignore].
      - name: Rust tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace
