name: release

# Push a tag like `v0.2.0` to build DBine for Windows, macOS (Apple
# Silicon + Intel) and Linux, and its Android phone app (mobile/), and
# publish them as a GitHub release. The app
# version is taken from the tag. A manual run (Actions → release → Run
# workflow) builds everything and keeps the installers as workflow
# artifacts, without publishing a release.
# If the release already exists (created locally with `gh release create`,
# which pushes the tag too), the tag run builds without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release goes out by one path only (docs/updates.md): from CI
  # or locally (`gh release create vX.Y.Z`, which also pushes the tag and
  # starts this workflow). When the release already exists, it's a local
  # one: CI only builds and keeps the installers as artifacts, so it never
  # replaces the local packages or their latest.json.
  route:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.route.outputs.publish }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      # What's new, from CHANGELOG.md (English, the source): this version
      # and the four before it, each under "## Version x.y.z". It becomes
      # latest.json's notes, and the update dialog keeps the versions newer
      # than the installed app (in another UI language it reads
      # changelog/CHANGELOG.<lang>.md at this tag instead, falling back to
      # these). A tag without its section in the changelog doesn't publish.
      - id: notes
        shell: bash
        run: |
          notes=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            notes="$(python3 scripts/changelog.py recent "${GITHUB_REF_NAME#v}" --count 5 --lang en)"
          fi
          {
            echo "notes<<DBINE_NOTES_EOF"
            echo "$notes"
            echo "DBINE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - id: route
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          # A draft left by an earlier run of this tag is CI's own: it gets
          # filled in again. Only a published release means a local one.
          elif [[ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" == "false" ]]; then
            echo "::notice::Release $GITHUB_REF_NAME already exists (published locally): building without publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # The driver hosts that need building (a new version), spread over
  # shards per target: each host is a full release build of its own, so one
  # job building them one after another took hours. Shards only build: the
  # target's app job below runs the checks, publishes the hosts and writes the
  # index (one writer per target), taking the shards' files instead of
  # building them again.
  driver-shards:
    needs: route
    name: drivers ${{ matrix.name }} ${{ matrix.shard }}/4
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        name: [windows-x64, macos-arm64, macos-x64, linux-x64]
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/driver-hosts
        with:
          target: ${{ matrix.target }}
          save-cache: "false"

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak -E '/^\[workspace\.package\]/,/^\[/ s/^(version[[:space:]]*=[[:space:]]*)"[^"]*"/\1"'"$VERSION"'"/' Cargo.toml

      - name: Build this shard's driver hosts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download drivers -p "index-${{ matrix.target }}.json" -D driver-index 2>/dev/null \
            || echo "No published index for ${{ matrix.target }} yet: every driver gets built."
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/build-driver-hosts.py ${{ matrix.target }} driver-shard \
            "https://github.com/${{ github.repository }}/releases/download/drivers" \
            "driver-index/index-${{ matrix.target }}.json" --shard ${{ matrix.shard }}/4

      - uses: actions/upload-artifact@v4
        with:
          name: driver-shard-${{ matrix.target }}-${{ matrix.shard }}
          path: driver-shard/*.gz
          if-no-files-found: ignore
          retention-days: 3

  build:
    needs: [route, driver-shards]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          # A native Intel runner (no cross-compiling of native deps).
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      # The app tags and their history: each new driver's min_app is the
      # oldest recent app with the same app <-> host code
      # (scripts/driver_index.py).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Linux libraries, Rust toolchain and cache, the same for drivers.yml.
      - uses: ./.github/actions/driver-hosts
        with:
          target: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const conf = "src-tauri/tauri.conf.json";
            const j = JSON.parse(fs.readFileSync(conf, "utf8"));
            j.version = v;
            fs.writeFileSync(conf, JSON.stringify(j, null, 2) + "\n");
            const cargo = fs.readFileSync("Cargo.toml", "utf8")
              .replace(/(\[workspace\.package\][\s\S]*?version\s*=\s*)"[^"]*"/, `$1"${v}"`);
            fs.writeFileSync("Cargo.toml", cargo);
          ' "$VERSION"
          echo "version -> $VERSION"

      # The hosts the shards built for this target (none when every driver
      # version is already published).
      - uses: actions/download-artifact@v4
        with:
          pattern: driver-shard-${{ matrix.target }}-*
          path: driver-prebuilt
          merge-multiple: true

      # Every driver except the built-in ones is its own small program that
      # the app downloads the first time it's used. Drivers have their own
      # versions and live in the permanent `drivers` release: only the ones
      # whose version isn't published yet are built (docs/on-demand-drivers.md),
      # by the shards above; one a shard didn't leave is built here.
      - name: Build new driver versions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download drivers -p "index-${{ matrix.target }}.json" -D driver-index 2>/dev/null \
            || echo "No published index for ${{ matrix.target }} yet: every driver gets built."
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/build-driver-hosts.py ${{ matrix.target }} driver-hosts \
            "https://github.com/${{ github.repository }}/releases/download/drivers" \
            "driver-index/index-${{ matrix.target }}.json" --prebuilt driver-prebuilt
          cat driver-hosts/summary.md >> "$GITHUB_STEP_SUMMARY"
          # A native path: on Windows, bash's $PWD is /d/a/… and Rust can't open it.
          CATALOG="$PWD/driver-hosts/plugins.json"
          if command -v cygpath >/dev/null; then CATALOG=$(cygpath -w "$CATALOG"); fi
          echo "DBINE_PLUGIN_CATALOG=$CATALOG" >> "$GITHUB_ENV"

      # Before the app: a published app never points to a driver that isn't
      # there. A driver file is never replaced (its id is its version);
      # the index is: the new hosts are merged into the one published now
      # (a driver release may have changed it since), signed with the
      # updater key and uploaded with its .sig.
      - name: Publish new driver versions
        if: needs.route.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Missing secret TAURI_SIGNING_PRIVATE_KEY: the driver index can't be signed."
            exit 1
          fi
          if [ -s driver-hosts/new-files.txt ]; then
            # --clobber: these ids aren't in the published index (the build
            # checked), so a file under that name is a leftover of a run that
            # stopped before publishing the index, never one an app uses.
            (cd driver-hosts && tr -d '\r' < new-files.txt | xargs gh release upload drivers --clobber)
          fi
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/driver_index.py publish ${{ matrix.target }} driver-hosts

      # The app updates itself from latest.json (docs/updates.md):
      # every installer it points at must be signed with the updater key.
      # Without the key, stop instead of publishing unsigned updates.
      - name: Updater signing key present
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Missing secrets TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD: updates can't be signed."
            exit 1
          fi

      # The app below is built without the downloadable drivers' crates
      # (`--no-default-features`); this checks every crate it does compile
      # gets the same features as in a build with every driver, so leaving
      # them out changes nothing in the app (src-tauri/Cargo.toml, `plugins`).
      - name: App compiled as with every driver
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/check-app-features.py ${{ matrix.target }}

      - name: Build (and publish on tags)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles (.app.tar.gz, NSIS, AppImage) and
          # their .sig files; the public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Cloud sync app registrations (docs/sync.md); empty
          # when the secrets aren't set: the providers show as unavailable.
          DBINE_GOOGLE_CLIENT_ID: ${{ secrets.DBINE_GOOGLE_CLIENT_ID }}
          DBINE_GOOGLE_CLIENT_SECRET: ${{ secrets.DBINE_GOOGLE_CLIENT_SECRET }}
          DBINE_MICROSOFT_CLIENT_ID: ${{ secrets.DBINE_MICROSOFT_CLIENT_ID }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@^2
          # tauri.updater.conf.json: also the signed updater packages.
          # After `--`, cargo's: without the default features only the
          # built-in drivers are compiled (the rest are downloaded).
          args: --target ${{ matrix.target }} --features plugins --config src-tauri/tauri.updater.conf.json -- --no-default-features
          tagName: ${{ needs.route.outputs.publish == 'true' && github.ref_name || '' }}
          releaseName: DBine ${{ github.ref_name }}
          # The changelog only: it's also latest.json's notes, which the
          # update dialog shows. The release page gets the downloads and the
          # signing notes added afterwards (release-page).
          releaseBody: ${{ needs.route.outputs.notes }}
          # A draft until every platform is up (release-page publishes it):
          # installed apps read releases/latest/latest.json, and a release
          # published by its first finished job would offer the update to
          # platforms that aren't in it yet.
          releaseDraft: true
          prerelease: false
          # latest.json for the in-app updater, merged across the four
          # jobs; Windows updates through the NSIS installer.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Keep drivers as artifacts (manual runs and local releases)
        if: ${{ needs.route.outputs.publish != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dbine-drivers-${{ matrix.name }}
          path: driver-hosts/
          if-no-files-found: error

      - name: Keep installers as artifacts (manual runs and local releases)
        if: ${{ needs.route.outputs.publish != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dbine-${{ matrix.name }}
          # Workspace build: installers land in <root>/target/<triple>/release/bundle.
          path: target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  # The phone app (mobile/, its own cargo workspace): a release APK for
  # arm64, signed here with the app's key (not in Gradle) and checked against
  # the certificate the app's App Links trust (dbine.com's assetlinks.json).
  # It builds alongside the desktop jobs; android-upload adds it to their
  # draft once that exists. Its name, DBine-<version>-android.apk, is what
  # the phone app's update check and dbine.com/download/android look for.
  android:
    needs: route
    runs-on: ubuntu-24.04
    env:
      # The tauri-cli Gradle calls back as `cargo tauri` (the committed
      # buildSrc/BuildTask.kt), of the same 2.12 line as mobile's tauri crate.
      TAURI_CLI_VERSION: "2.12.1"
      ANDROID_PLATFORM: "36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      ANDROID_NDK: "27.2.12479018"
      # SHA-256 of the signing certificate (docs/mobile-companion.md).
      ANDROID_CERT_SHA256: "12:C1:C2:51:1A:1F:B9:57:A6:39:4D:E7:2E:99:86:55:8C:04:0D:F1:1E:34:6F:6A:07:7B:87:02:9E:BC:83:42"
    steps:
      # The whole repo: mobile's build reads web/src/locales (scripts/catalog.py)
      # and the channel's crate (crates/dbine-link).
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version -> $VERSION"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile/src-tauri/gen/android/*.gradle*
            mobile/src-tauri/gen/android/app/*.gradle*
            mobile/src-tauri/gen/android/buildSrc/*.gradle*
            mobile/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties

      # The runner image has the SDK and its sdkmanager; this adds the exact
      # platform, build-tools and NDK the app is built with.
      - name: Android SDK and NDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # The image has them accepted; this keeps a new one from waiting on a prompt
          # (`|| true`: yes ends by SIGPIPE, which pipefail would count as a failure).
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "mobile/src-tauri -> target"
          key: aarch64-linux-android

      - name: Cache tauri-cli
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install tauri-cli
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install the phone app's dependencies
        run: npm ci --prefix mobile

      # Release build, arm64 only (--target aarch64): Gradle leaves it
      # unsigned. The version goes in through --config (versionName = the
      # tag's version; versionCode derived from it), not by editing the file.
      - name: Build the APK
        working-directory: mobile
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cargo tauri android build --apk --target aarch64 --config "{\"version\":\"$VERSION\"}"

      # Signed outside Gradle: zipalign first (apksigner's v2+ signature
      # covers the aligned file), then v2 + v3 (minSdk 24 needs no v1). The
      # keystore only exists in $RUNNER_TEMP for this step.
      - name: Sign and check the APK
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Missing secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD: the APK can't be signed."
            exit 1
          fi
          UNSIGNED=mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          test -f "$UNSIGNED" || { echo "::error::No unsigned APK at $UNSIGNED"; exit 1; }
          KEYSTORE="$RUNNER_TEMP/dbine-android.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          mkdir -p android-out
          APK="android-out/DBine-$VERSION-android.apk"
          zipalign -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          apksigner sign --ks "$KEYSTORE" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false \
            --out "$APK" "$RUNNER_TEMP/aligned.apk"
          zipalign -c -p 4 "$APK"
          apksigner verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/verify.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/verify.txt"
          # Exactly one signer, and it's the certificate dbine.com's assetlinks.json trusts.
          WANT="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
          GOT="$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' "$RUNNER_TEMP/verify.txt" | sort -u)"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::The APK's signing certificate SHA-256 is '$GOT', expected '$WANT' (the app's key)."
            exit 1
          fi
          # The phone app compares its versionName with the release's tag.
          # sed, not head: head would close the pipe early and fail under pipefail.
          BADGING="$(aapt2 dump badging "$APK" | sed -n 1p)"
          echo "$BADGING"
          if ! grep -q "package: name='io.addlayer.dbine.mobile' .*versionName='$VERSION'" <<< "$BADGING"; then
            echo "::error::The APK isn't io.addlayer.dbine.mobile with versionName $VERSION."
            exit 1
          fi
          sha256sum "$APK" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dbine-android
          path: android-out/*.apk
          if-no-files-found: error
          # Tag runs only need it until android-upload has put it in the release.
          retention-days: ${{ needs.route.outputs.publish == 'true' && 3 || 30 }}

  # The APK into the draft the desktop builds created (the draft exists once
  # `build` is done). Separate from `android` so that build runs alongside
  # the desktop ones instead of waiting for them.
  android-upload:
    needs: [route, build, android]
    if: needs.route.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dbine-android
          path: android-out
      - name: Upload the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" android-out/DBine-*-android.apk --clobber --repo "$GITHUB_REPOSITORY"

  # The `drivers` release holds at most 1000 assets and every release adds
  # the hosts that changed. Once all four targets are published, keep only
  # the hosts the last five app versions download (scripts/prune-driver-
  # assets.py); it deletes nothing if the newest release's hosts aren't all
  # there.
  prune-drivers:
    needs: [route, build]
    if: needs.route.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # One prune at a time (drivers.yml prunes too).
    concurrency:
      group: drivers-prune
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # It also keeps the newest host of each driver and the ones those apps
      # switch to on their own, and signs the indexes it rewrites.
      - name: Delete driver hosts older than the last five versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 scripts/prune-driver-assets.py --keep 5

  # The release page: this version's changelog (English), then how to
  # download and open the unsigned builds. latest.json keeps the changelog alone.
  # It waits for the phone app too: a failed Android build or upload leaves
  # the release a draft, like a failed desktop build.
  release-page:
    needs: [route, build, android-upload]
    if: needs.route.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo "DBine ${GITHUB_REF_NAME} installers."
            echo
            python3 scripts/changelog.py notes "${GITHUB_REF_NAME#v}" --lang en
            cat <<'EOF'

          ### Downloads

          - **Windows**: `-setup.exe` (requires WebView2, included in Windows 10/11).
          - **macOS**: `.dmg`; `aarch64` for Apple Silicon, `x64` for Intel.
          - **Linux**: `.AppImage` (portable), `.deb` or `.rpm`.
          - **Android**: the phone app that pairs with DBine on your computer. Install it from [dbine.com](https://dbine.com/download/android) or with the `-android.apk` below; the first time, Android asks to allow installing apps from that source (the browser or the files app).
          - **Linux (Flatpak)**: `.flatpak` (`x86_64` or `aarch64`), for `flatpak install --user ./dbine-….flatpak`; it doesn't update itself. Built by the `flathub` workflow, it appears here a while after the other files.

          Version 0.1.4 and later receive it through the automatic update.

          The binaries aren't signed by Apple or Microsoft:

          - **macOS**: the first time, it warns that it can't verify the developer. Open System Settings › Privacy & Security › "Open Anyway", or run in the terminal: `xattr -dr com.apple.quarantine /Applications/DBine.app`.
          - **Windows**: SmartScreen may ask for "More info" › "Run anyway".
          - Each engine's driver (except SQLite) is downloaded the first time you connect.
          EOF
          } > notes.md
