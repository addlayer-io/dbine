name: release

# Push a tag like `v0.2.0` to build DBine for Windows, macOS (Apple
# Silicon + Intel) and Linux and publish them as a GitHub release. The app
# version is taken from the tag. A manual run (Actions → release → Run
# workflow) builds everything and keeps the installers as workflow
# artifacts, without publishing a release.
# If the release already exists (created locally with `gh release create`,
# which pushes the tag too), the tag run builds without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release goes out by one path only (docs/actualizaciones.md): from CI
  # or locally (`gh release create vX.Y.Z`, which also pushes the tag and
  # starts this workflow). When the release already exists, it's a local
  # one: CI only builds and keeps the installers as artifacts, so it never
  # replaces the local packages or their latest.json.
  route:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.route.outputs.publish }}
    steps:
      - id: route
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME already exists (published locally): building without publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: route
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          # A native Intel runner (no cross-compiling of native deps).
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      # The app tags and their history: each new driver's min_app is the
      # oldest recent app with the same app <-> host code
      # (scripts/driver_index.py).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Linux libraries, Rust toolchain and cache, the same for drivers.yml.
      - uses: ./.github/actions/driver-hosts
        with:
          target: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const conf = "src-tauri/tauri.conf.json";
            const j = JSON.parse(fs.readFileSync(conf, "utf8"));
            j.version = v;
            fs.writeFileSync(conf, JSON.stringify(j, null, 2) + "\n");
            const cargo = fs.readFileSync("Cargo.toml", "utf8")
              .replace(/(\[workspace\.package\][\s\S]*?version\s*=\s*)"[^"]*"/, `$1"${v}"`);
            fs.writeFileSync("Cargo.toml", cargo);
          ' "$VERSION"
          echo "version -> $VERSION"

      # Every driver except the built-in ones is its own small program that
      # the app downloads the first time it's used. Drivers have their own
      # versions and live in the permanent `drivers` release: only the ones
      # whose version isn't published yet are built (docs/drivers-bajo-demanda.md).
      - name: Build new driver versions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download drivers -p "index-${{ matrix.target }}.json" -D driver-index 2>/dev/null \
            || echo "No published index for ${{ matrix.target }} yet: every driver gets built."
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/build-driver-hosts.py ${{ matrix.target }} driver-hosts \
            "https://github.com/${{ github.repository }}/releases/download/drivers" \
            "driver-index/index-${{ matrix.target }}.json"
          cat driver-hosts/summary.md >> "$GITHUB_STEP_SUMMARY"
          # A native path: on Windows, bash's $PWD is /d/a/… and Rust can't open it.
          CATALOG="$PWD/driver-hosts/plugins.json"
          if command -v cygpath >/dev/null; then CATALOG=$(cygpath -w "$CATALOG"); fi
          echo "DBINE_PLUGIN_CATALOG=$CATALOG" >> "$GITHUB_ENV"

      # Before the app: a published app never points to a driver that isn't
      # there. A driver file is never replaced (its id is its version);
      # the index is: the new hosts are merged into the one published now
      # (a driver release may have changed it since), signed with the
      # updater key and uploaded with its .sig.
      - name: Publish new driver versions
        if: needs.route.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Missing secret TAURI_SIGNING_PRIVATE_KEY: the driver index can't be signed."
            exit 1
          fi
          if [ -s driver-hosts/new-files.txt ]; then
            (cd driver-hosts && tr -d '\r' < new-files.txt | xargs gh release upload drivers)
          fi
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/driver_index.py publish ${{ matrix.target }} driver-hosts

      # The app updates itself from latest.json (docs/actualizaciones.md):
      # every installer it points at must be signed with the updater key.
      # Without the key, stop instead of publishing unsigned updates.
      - name: Updater signing key present
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Missing secrets TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD: updates can't be signed."
            exit 1
          fi

      - name: Build (and publish on tags)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles (.app.tar.gz, NSIS, AppImage) and
          # their .sig files; the public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Cloud sync app registrations (docs/sincronizacion.md); empty
          # when the secrets aren't set: the providers show as unavailable.
          DBINE_GOOGLE_CLIENT_ID: ${{ secrets.DBINE_GOOGLE_CLIENT_ID }}
          DBINE_GOOGLE_CLIENT_SECRET: ${{ secrets.DBINE_GOOGLE_CLIENT_SECRET }}
          DBINE_MICROSOFT_CLIENT_ID: ${{ secrets.DBINE_MICROSOFT_CLIENT_ID }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@^2
          # tauri.updater.conf.json: also the signed updater packages.
          args: --target ${{ matrix.target }} --features plugins --config src-tauri/tauri.updater.conf.json
          tagName: ${{ needs.route.outputs.publish == 'true' && github.ref_name || '' }}
          releaseName: DBine ${{ github.ref_name }}
          releaseBody: |
            Instaladores de DBine ${{ github.ref_name }}.

            - **Windows**: `.msi` o `-setup.exe` (requiere WebView2, incluido en Windows 10/11).
            - **macOS**: `.dmg` — `aarch64` para Apple Silicon, `x64` para Intel.
            - **Linux**: `.AppImage` (portable), `.deb` o `.rpm`.

            Los binarios no están firmados por Apple ni por Microsoft:

            - **macOS**: la primera vez avisa que no puede verificar al desarrollador. Abrí
              Configuración del Sistema › Privacidad y seguridad › «Abrir igualmente», o
              en la terminal: `xattr -dr com.apple.quarantine /Applications/DBine.app`.
            - **Windows**: SmartScreen puede pedir "Más información" › "Ejecutar de todas formas".
            - Los drivers de cada motor (salvo SQLite) se descargan la primera vez que te conectás.
          releaseDraft: false
          prerelease: false
          # latest.json for the in-app updater, merged across the four
          # jobs; Windows updates through the NSIS installer.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Keep drivers as artifacts (manual runs and local releases)
        if: ${{ needs.route.outputs.publish != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dbine-drivers-${{ matrix.name }}
          path: driver-hosts/
          if-no-files-found: error

      - name: Keep installers as artifacts (manual runs and local releases)
        if: ${{ needs.route.outputs.publish != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dbine-${{ matrix.name }}
          # Workspace build: installers land in <root>/target/<triple>/release/bundle.
          path: target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  # The `drivers` release holds at most 1000 assets and every release adds
  # the hosts that changed. Once all four targets are published, keep only
  # the hosts the last five app versions download (scripts/prune-driver-
  # assets.py); it deletes nothing if the newest release's hosts aren't all
  # there.
  prune-drivers:
    needs: [route, build]
    if: needs.route.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # One prune at a time (drivers.yml prunes too).
    concurrency:
      group: drivers-prune
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # It also keeps the newest host of each driver and the ones those apps
      # switch to on their own, and signs the indexes it rewrites.
      - name: Delete driver hosts older than the last five versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 scripts/prune-driver-assets.py --keep 5
