name: flathub

# Prepares the Flathub manifest for a release and opens a PR on
# github.com/flathub/io.addlayer.dbine; Flathub builds the app on its own
# infrastructure from that repository (docs/flathub.md).
#
# - A release published with a personal token (`gh release create`) starts
#   it through `release`. A release the `release` workflow publishes uses
#   GITHUB_TOKEN, which starts no other workflow: that case comes through
#   `workflow_run` when `release` ends well on a `v*` tag.
# - By hand (Actions › flathub › Run workflow): pick the tag; `dry_run`
#   (on by default) only renders and lints, and keeps the files as an
#   artifact.
#
# Opening the PR needs the FLATHUB_TOKEN secret: a token of an account with
# write access to flathub/io.addlayer.dbine (fine-grained: Contents and Pull
# requests, read and write, on that repository). Without it the run renders,
# lints, keeps the artifact and skips the PR with a notice.
#
# The cloud client IDs (docs/sync.md) are compiled into the app; Flathub
# builds from a public manifest, so they go into it only when the repository
# variables DBINE_GOOGLE_CLIENT_ID, DBINE_GOOGLE_CLIENT_SECRET and
# DBINE_MICROSOFT_CLIENT_ID are set (Settings › Variables). Without them the
# Flathub build has no Google Drive / OneDrive sync; folder sync still works.
#
# The `bundle` jobs build the same manifest into a single-file
# `dbine-X.Y.Z-<arch>.flatpak` per architecture and, unless it's a dry run,
# `bundle-release` attaches them to the tag's GitHub release. They are
# separate jobs: a failed bundle changes nothing in the release or the PR.

on:
  release:
    types: [published]
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z)"
        required: true
      dry_run:
        description: "Only render and lint; keep the files as an artifact, no PR"
        type: boolean
        default: true

permissions:
  contents: read

env:
  # flatpak/flatpak-builder-tools has no releases: a pinned commit.
  BUILDER_TOOLS_COMMIT: 74697c75b630d7330e77250fc13cb5ea688d9479
  FLATHUB_REPO: flathub/io.addlayer.dbine
  APP_ID: io.addlayer.dbine

concurrency:
  group: flathub-${{ github.event.release.tag_name || github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      dry_run: ${{ steps.tag.outputs.dry_run }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v'))
    steps:
      - name: Release tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || github.event.workflow_run.head_branch || inputs.tag }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY:-false}" >> "$GITHUB_OUTPUT"

      # The workflow's own commit for the packaging (flatpak/), which may be
      # newer than the tag; the tag in src/ for what gets built: its commit
      # and its lockfiles (the offline sources).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          path: src

      - name: Commit of the tag
        id: commit
        run: echo "commit=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: flatpak-builder-tools
        run: |
          git clone --quiet https://github.com/flatpak/flatpak-builder-tools "$RUNNER_TEMP/fbt"
          git -C "$RUNNER_TEMP/fbt" checkout --quiet "$BUILDER_TOOLS_COMMIT"
          python -m pip install --quiet aiohttp tomlkit "$RUNNER_TEMP/fbt/node"

      - name: Render the manifest, the metainfo and the offline sources
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          DBINE_GOOGLE_CLIENT_ID: ${{ vars.DBINE_GOOGLE_CLIENT_ID }}
          DBINE_GOOGLE_CLIENT_SECRET: ${{ vars.DBINE_GOOGLE_CLIENT_SECRET }}
          DBINE_MICROSOFT_CLIENT_ID: ${{ vars.DBINE_MICROSOFT_CLIENT_ID }}
        run: |
          out="$RUNNER_TEMP/flathub"
          python3 flatpak/render.py --tag "$TAG" --commit "$COMMIT" --out "$out" \
            --env "DBINE_GOOGLE_CLIENT_ID=$DBINE_GOOGLE_CLIENT_ID" \
            --env "DBINE_GOOGLE_CLIENT_SECRET=$DBINE_GOOGLE_CLIENT_SECRET" \
            --env "DBINE_MICROSOFT_CLIENT_ID=$DBINE_MICROSOFT_CLIENT_ID"
          python3 "$RUNNER_TEMP/fbt/cargo/flatpak-cargo-generator.py" src/Cargo.lock -o "$out/cargo-sources.json"
          flatpak-node-generator npm src/web/package-lock.json -o "$out/node-sources.json"
          # Flathub's repository README and build settings ride along.
          cp flatpak/flathub.json "$out/"
          ls -la "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flathub-${{ steps.tag.outputs.tag }}
          path: ${{ env.OUT }}

      # Flathub's own linter and AppStream validation, before anything is
      # sent. finish-args-home-filesystem-access and
      # finish-args-has-socket-ssh-auth need an exception that Flathub's
      # reviewers grant on the first submission (docs/flathub.md); until it
      # is in place they are reported and not fatal.
      - name: Lint
        run: |
          docker run --rm -v "$OUT:/r:ro" ghcr.io/flathub/flatpak-builder-lint:latest \
            manifest "/r/$APP_ID.yml" > "$RUNNER_TEMP/lint.json" || true
          cat "$RUNNER_TEMP/lint.json"
          python3 - "$RUNNER_TEMP/lint.json" <<'EOF'
          import json, sys
          text = open(sys.argv[1]).read().strip()
          r = json.loads(text) if text else {}
          allowed = {"finish-args-home-filesystem-access", "finish-args-has-socket-ssh-auth"}
          bad = [e for e in r.get("errors", []) if e not in allowed]
          for e in r.get("errors", []):
              print(f"::{'error' if e in bad else 'warning'}::linter: {e}")
          sys.exit(1 if bad else 0)
          EOF
          docker run --rm -v "$OUT:/r:ro" --entrypoint appstreamcli ghcr.io/flathub/flatpak-builder-lint:latest \
            validate --no-net --explain "/r/$APP_ID.metainfo.xml"

      # Off while DBine isn't on Flathub (the submission was declined, see
      # docs/flathub.md): the downloadable .flatpak below still ships with
      # every release. To submit again, drop `false &&`.
      - name: Pull request on Flathub
        if: false && steps.tag.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::FLATHUB_TOKEN is not set: the files are in the artifact, no PR was opened (docs/flathub.md)"
            exit 0
          fi
          branch="release-$TAG"
          dir="$RUNNER_TEMP/flathub-repo"
          gh repo clone "$FLATHUB_REPO" "$dir" -- --quiet
          cd "$dir"
          base=$(gh repo view "$FLATHUB_REPO" --json defaultBranchRef -q .defaultBranchRef.name)
          git switch --quiet -c "$branch"
          cp "$OUT"/* .
          git config user.name "DBine release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::$FLATHUB_REPO already has $TAG"; exit 0
          fi
          git commit --quiet -m "Update to $TAG"
          gh auth setup-git
          git push --force --quiet origin "$branch"
          if [ -n "$(gh pr list --repo "$FLATHUB_REPO" --head "$branch" --json number -q '.[].number')" ]; then
            echo "::notice::the PR for $TAG was updated"
          else
            gh pr create --repo "$FLATHUB_REPO" --base "$base" --head "$branch" \
              --title "Update to $TAG" \
              --body "DBine $TAG (https://github.com/addlayer-io/dbine/releases/tag/$TAG), prepared by the flathub workflow. Flathub's test build runs on this PR; merging publishes it."
          fi

  # A downloadable .flatpak per architecture, built from the manifest the
  # `manifest` job rendered (docs/flathub.md, "Downloadable .flatpak"). It
  # runs even if the lint or the Flathub PR failed, as long as the files
  # were rendered: the bundle doesn't go through Flathub's review.
  bundle:
    needs: manifest
    if: ${{ !cancelled() && needs.manifest.outputs.tag != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The image of flatpak-github-actions with GNOME 51's Sdk preinstalled
    # (amd64 and arm64); the SDK extensions come from Flathub during the
    # build. flatpak-builder needs --privileged for its sandbox.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
      # The runner's preinstalled toolchains that this build doesn't use,
      # mounted to delete them: the Rust build with every driver plus
      # llama.cpp needs the disk space.
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
        # A host folder for the swap file: swap can't live on the
        # container's overlay filesystem.
        - /var/lib/dbine-swap:/host/swap
    timeout-minutes: 300
    env:
      TAG: ${{ needs.manifest.outputs.tag }}
    steps:
      - name: Free disk space
        run: |
          df -h / || true
          rm -rf /host/dotnet/* /host/android/* /host/ghc/* || true
          df -h / || true

      # The final link (fat LTO, one codegen unit, every driver) needs more
      # memory than the ARM runner has, and the kernel kills rustc without
      # it. Swap only slows that link; the binary is the same.
      - name: Swap
        shell: python3 {0}
        run: |
          # The image has neither mkswap nor swapon (nor a package manager):
          # Python writes the swap header (v1, as mkswap does) and calls
          # swapon(2), which the privileged container is allowed to.
          import ctypes, os
          path = "/host/swap/swapfile"
          size = 16 << 30
          page = os.sysconf("SC_PAGE_SIZE")
          fd = os.open(path, os.O_CREAT | os.O_RDWR, 0o600)
          os.posix_fallocate(fd, 0, size)
          header = bytearray(page)
          header[1024:1036] = (1).to_bytes(4, "little") + (size // page - 1).to_bytes(4, "little") + bytes(4)
          header[page - 10:] = b"SWAPSPACE2"
          os.pwrite(fd, bytes(header), 0)
          os.fsync(fd)
          os.close(fd)
          libc = ctypes.CDLL(None, use_errno=True)
          if libc.swapon(path.encode(), 0) != 0:
              raise OSError(ctypes.get_errno(), "swapon " + path)
          print(open("/proc/swaps").read())

      - name: Bundle name
        id: name
        run: echo "bundle=dbine-${TAG#v}-${{ matrix.arch }}.flatpak" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flathub-${{ needs.manifest.outputs.tag }}
          path: flathub

      # Builds the app and its modules, then `flatpak build-bundle` with
      # --runtime-repo=<repository-url>: installing the file adds Flathub
      # and pulls GNOME 51 from it. The cache is flatpak-builder's state
      # dir (downloads, ccache and the finished modules): git, unixODBC and
      # llama.cpp are reused from the previous release when they haven't
      # changed; the app itself always builds from its tag.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: flathub/io.addlayer.dbine.yml
          arch: ${{ matrix.arch }}
          bundle: ${{ steps.name.outputs.bundle }}
          repository-url: https://dl.flathub.org/repo/flathub.flatpakrepo
          repository-name: flathub
          branch: stable
          cache: true
          artifact-name: flatpak-${{ needs.manifest.outputs.tag }}-${{ matrix.arch }}

  # Attaches the bundles that were built to the tag's release (not on dry
  # runs). The only job that writes to the repository.
  bundle-release:
    needs: [manifest, bundle]
    if: ${{ !cancelled() && needs.manifest.outputs.tag != '' && needs.manifest.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.manifest.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: flatpak-${{ needs.manifest.outputs.tag }}-*
          path: bundles
          merge-multiple: true

      - name: Upload to the release
        run: |
          shopt -s nullglob
          files=(bundles/*.flatpak)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no .flatpak was built for $TAG"; exit 1
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null; then
            echo "::error::$TAG has no GitHub release"; exit 1
          fi
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          if [ ${#files[@]} -lt 2 ]; then
            echo "::warning::only ${files[*]} was built; the other architecture failed (see the bundle job)"
          fi
