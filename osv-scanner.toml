# Dependency advisories reviewed and found not to affect DBine. OSV-Scanner
# (and OpenSSF Scorecard, which uses it) leaves them out; the security status
# page lists each one with its reason (SECURITY.md). Add an entry only after
# checking that DBine can't reach the flaw, and say how it was checked.

# glib 0.18 (Linux, with Tauri's GTK 3 stack; can't be upgraded on DBine's side).
[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
reason = "Doesn't affect DBine. The flaw is in glib::VariantStrIter, which only runs through Variant::array_iter_str, and neither DBine nor any of its dependencies calls it (checked in gtk, gdk, gio, webkit2gtk, javascriptcore, soup3, wry and tao). glib 0.18 comes with Tauri's GTK 3 stack on Linux and can't be upgraded on DBine's side."

# rand 0.7.3 (from winauth, Windows sign-in for SQL Server).
[[IgnoredVulns]]
id = "GHSA-cq8v-f236-94qc"
reason = "Doesn't affect DBine. The flaw needs rand's log feature and a custom logger that calls ThreadRng; DBine's build doesn't enable that feature (rand 0.7.3 comes from winauth, the Windows sign-in for SQL Server, with default features only)."

# zip 8 (DuckDB and llama.cpp downloads, spreadsheets) and zip 6 (libduckdb-sys build script).
[[IgnoredVulns]]
id = "RUSTSEC-2026-0367"
reason = "Doesn't affect DBine. The three zip advisories are in ZipArchive::extract and ZipStreamReader::extract; DBine never calls them (it reads entries one by one, keeps only rwx permission bits and writes no symlinks), nor do calamine or rust_xlsxwriter. zip 6 only runs in libduckdb-sys's build script on its own bundled archive."

