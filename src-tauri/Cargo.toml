[package]
name = "dbine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multi-database manager"

[lib]
name = "dbine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dbine"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# One process-wide TLS crypto provider, installed at start: with several
# drivers in one process more than one is compiled in, and clients that rely
# on the default (the AWS SDK's) can't pick one by themselves.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
dbine-driver = { path = "../crates/dbine-driver" }
dbine-core = { path = "../crates/dbine-core" }
dbine-drivers = { path = "../crates/dbine-drivers" }
dbine-tunnel = { path = "../crates/dbine-tunnel" }
dbine-sync = { path = "../crates/dbine-sync" }
dbine-schema = { path = "../crates/dbine-schema" }
dbine-transfer = { path = "../crates/dbine-transfer" }
dbine-ai = { path = "../crates/dbine-ai" }
tauri-plugin-opener = "2"
# In-app updates (commands/updates.rs, docs/actualizaciones.md). Pinned to
# 2.12: 2.13 needs tauri 2.12. Without `zip`: the updater bundles are the
# NSIS installer, the AppImage and the macOS .app.tar.gz, none zipped.
tauri-plugin-updater = { version = "~2.12", default-features = false, features = ["rustls-tls", "system-proxy"] }
reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
dashmap.workspace = true
base64.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing-appender = "0.2"
mimalloc = { version = "0.1", default-features = false }
# The local MCP server (src/mcp): HTTP on 127.0.0.1, token hashes, its activity log.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
sha2 = "0.10"
getrandom = "0.3"
rusqlite.workspace = true

# The Dock menu's "Nueva ventana" (src/dock_macos.rs): the same versions tao
# already uses, so nothing new is compiled in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }

# A second launch (taskbar task, desktop action) opens a window in the running
# process. macOS keeps one instance by itself.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# The taskbar Jump List's "Nueva ventana" (src/jumplist_windows.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }

[features]
# Release builds: only the built-in drivers (dbine_drivers::BUILT_IN) stay
# in the app; the rest are downloaded on first use. `cargo tauri build
# --features plugins`, with DBINE_PLUGIN_CATALOG set (scripts/build-driver-hosts.py).
plugins = ["dbine-drivers/plugins"]
