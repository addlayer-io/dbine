[package]
name = "dbine-tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SSH tunnels for DBine connections: a local port forwarded to the database server through one or more SSH hosts"

[dependencies]
russh = "0.64"
tokio = { workspace = true }
tracing.workspace = true
thiserror = "2"
# RSA user keys sign with aws-lc-rs (constant time) instead of the `rsa`
# crate (RUSTSEC-2023-0071); `rsa` only converts the key (src/rsa_sign.rs).
# Both are already in the tree through russh.
aws-lc-rs = "1"
rsa = { version = "=0.10.0-rc.18", default-features = false, features = ["std", "encoding"] }

# Who connected to the local port (see src/peer.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Threading",
] }
