[package]
name = "dbine-driver-postgres"
version = "0.1.15"  # the driver's own version: bump it when the driver changes (docs/on-demand-drivers.md)
edition.workspace = true
license.workspace = true

[dependencies]
dbine-driver = { path = "../../dbine-driver" }
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio-postgres = "0.7.18"
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
# Cloud sign-in (cloud_auth.rs): SHA-256 for the AWS SigV4 token, the same
# release tokio-postgres already uses for SCRAM.
sha2 = "0.11"
futures.workspace = true
