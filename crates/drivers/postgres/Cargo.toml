[package]
name = "dbine-driver-postgres"
version = "0.1.19"  # the driver's own version: bump it when the driver changes (docs/on-demand-drivers.md)
edition.workspace = true
license.workspace = true

[dependencies]
dbine-driver = { path = "../../dbine-driver" }
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio-postgres = "0.7.18"
dbine-tls = { path = "../../dbine-tls" }
tokio-rustls = { version = "0.26", default-features = false }
# Cloud sign-in (cloud_auth.rs): SHA-256 for the AWS SigV4 token, the same
# release tokio-postgres already uses for SCRAM.
sha2 = "0.11"
futures.workspace = true
