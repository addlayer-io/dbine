[package]
name = "dbine-driver-cassandra"
version = "0.1.5"  # the driver's own version: bump it when the driver changes (docs/drivers-bajo-demanda.md)
edition.workspace = true
license.workspace = true
description = "DBine driver for Apache Cassandra and ScyllaDB (CQL native protocol)"

[dependencies]
dbine-driver = { path = "../../dbine-driver" }
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
futures.workspace = true
chrono.workspace = true
scylla = { version = "1.9", features = ["rustls-023"] }
rustls-native-certs = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
tokio.workspace = true
