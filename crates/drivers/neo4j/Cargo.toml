[package]
name = "dbine-driver-neo4j"
version = "0.1.3"  # the driver's own version: bump it when the driver changes (docs/drivers-bajo-demanda.md)
edition.workspace = true
license.workspace = true
description = "DBine driver for graph databases: Neo4j and Memgraph (Bolt), Amazon Neptune (openCypher over HTTPS)"

[dependencies]
dbine-driver = { path = "../../dbine-driver" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
percent-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
aws-config = { version = "1.12", default-features = false, features = ["rt-tokio", "behavior-version-latest", "default-https-client", "sso"] }
aws-credential-types = "1.3"
aws-sigv4 = { version = "1.6", default-features = false, features = ["sign-http"] }
