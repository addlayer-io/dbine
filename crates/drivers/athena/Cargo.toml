[package]
name = "dbine-driver-athena"
version = "0.1.3"  # the driver's own version: bump it when the driver changes (docs/drivers-bajo-demanda.md)
edition.workspace = true
license.workspace = true

[dependencies]
dbine-driver = { path = "../../dbine-driver" }
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
aws-config = { version = "1.12", default-features = false, features = ["rt-tokio", "behavior-version-latest", "default-https-client", "sso"] }
aws-credential-types = "1.3"
# One process-wide TLS crypto provider: with several drivers in one process
# (dev builds, workspace tests) more than one is compiled in and the AWS
# client can't pick one by itself.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
aws-sdk-athena = { version = "1.121", default-features = false, features = ["rt-tokio", "behavior-version-latest", "default-https-client"] }

[dev-dependencies]
# Tests talk plain HTTP to local fakes: the default HTTPS client loads the
# OS root certificates and debug-panics where none can be read.
aws-smithy-http-client = { version = "1.4", default-features = false, features = ["default-client"] }
