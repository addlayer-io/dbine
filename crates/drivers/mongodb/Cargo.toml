[package]
name = "dbine-driver-mongodb"
version = "0.1.6"  # the driver's own version: bump it when the driver changes (docs/drivers-bajo-demanda.md)
edition.workspace = true
license.workspace = true

[dependencies]
dbine-driver = { path = "../../dbine-driver" }
tokio.workspace = true
serde_json.workspace = true
futures.workspace = true
chrono.workspace = true
base64.workspace = true
tracing.workspace = true
# `gssapi-auth`: Kerberos (GSSAPI) logins, through the system's GSSAPI on macOS/Linux
# (libgssapi_krb5 on Linux) and SSPI on Windows.
mongodb = { version = "3", features = ["gssapi-auth"] }
