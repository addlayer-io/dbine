[package]
name = "dbine-driver-kdb"
version = "0.1.0"  # the driver's own version: bump it when the driver changes (docs/on-demand-drivers.md)
edition.workspace = true
license.workspace = true
description = "DBine driver for kdb+ (KX), over q's IPC protocol"

[dependencies]
dbine-driver = { path = "../../dbine-driver" }
dbine-tls = { path = "../../dbine-tls" }
tokio.workspace = true
serde_json.workspace = true
chrono.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# TCP keepalive (already in the tree through tokio).
socket2 = "0.6"

[dev-dependencies]
tokio.workspace = true
