[package]
name = "dbine-driver-firebird"
version = "0.1.4"  # the driver's own version: bump it when the driver changes (docs/drivers-bajo-demanda.md)
edition.workspace = true
license.workspace = true
description = "Firebird driver for DBine (pure-Rust wire protocol, no fbclient library)"

[dependencies]
dbine-driver = { path = "../../dbine-driver" }
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
# The pure-Rust wire protocol behind rsfbclient's `pure_rust` feature, used
# directly (no fbclient library at build or run time).
rsfbclient-rust = "0.28"
rsfbclient-core = "0.28"
# rsfbclient's charset type: DBine plugs in a lenient decoder.
encoding-next = "0.3"

[dev-dependencies]
tokio.workspace = true
