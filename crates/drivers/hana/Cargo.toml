[package]
name = "dbine-driver-hana"
version = "0.1.13"  # the driver's own version: bump it when the driver changes (docs/on-demand-drivers.md)
edition.workspace = true
license.workspace = true
description = "SAP HANA driver for DBine (pure-Rust hdbconnect_async, no SAP client)"

[dependencies]
dbine-driver = { path = "../../dbine-driver" }
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
hdbconnect_async = "0.32"
# The trustStore folder: fresh, private, removed with the session.
tempfile = "3.27.0"

[dev-dependencies]
tokio.workspace = true
# The live TLS test (tests/tls.rs) installs the crypto provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
