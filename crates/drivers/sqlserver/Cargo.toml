[package]
name = "dbine-driver-sqlserver"
version = "0.1.4"  # the driver's own version: bump it when the driver changes (docs/drivers-bajo-demanda.md)
edition.workspace = true
license.workspace = true

[dependencies]
dbine-driver = { path = "../../dbine-driver" }
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "chrono", "rust_decimal", "rustls", "sql-browser-tokio"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
chrono.workspace = true
futures.workspace = true
roxmltree = "0.21.1"
# Microsoft Entra ID tokens (OAuth 2.0 token endpoint) for Azure SQL / Fabric.
reqwest.workspace = true
