[package]
name = "dbine-driver-dsql"
version = "0.1.6"  # the driver's own version: bump it when the driver changes (docs/on-demand-drivers.md)
edition.workspace = true
license.workspace = true

[dependencies]
dbine-driver = { path = "../../dbine-driver" }
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
futures.workspace = true
aws-config = { version = "1.12", default-features = false, features = ["rt-tokio", "behavior-version-latest", "default-https-client", "sso"] }
aws-credential-types = "1.3"
aws-sdk-dsql = { version = "1.73", default-features = false, features = ["rt-tokio", "behavior-version-latest", "default-https-client"] }
tokio-postgres = "0.7.18"
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
