[package]
name = "dbine-driver-powerbi"
version = "0.1.0"  # the driver's own version: bump it when the driver changes (docs/on-demand-drivers.md)
edition.workspace = true
license.workspace = true
description = "DBine driver for Power BI and Microsoft Fabric semantic models (DAX over the REST APIs)"

[dependencies]
dbine-driver = { path = "../../dbine-driver" }
tokio.workspace = true
serde.workspace = true
# raw_value (additive): `executeQueries` rows keep each number's literal
# text (fixed decimals). Never `preserve_order` or `arbitrary_precision`:
# feature unification would change serde_json for the whole build.
serde_json = { workspace = true, features = ["raw_value"] }
futures.workspace = true
tracing.workspace = true
reqwest.workspace = true
base64.workspace = true
chrono.workspace = true
uuid.workspace = true
# Entra ID sign-in: PKCE (S256) and the random `state` / verifier.
sha2 = "0.10"
getrandom = "0.2"
# `executeDaxQueries` answers Arrow IPC streams, LZ4_FRAME-compressed; the
# same arrow version as the Flight SQL driver.
arrow-ipc = { version = "58.4", features = ["lz4"] }
arrow-array = "58.4"
arrow-buffer = "58.4"
arrow-schema = "58.4"
arrow-cast = "58.4"

[dev-dependencies]
tokio.workspace = true
