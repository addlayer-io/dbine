[package]
name = "dbine-driver-dynamodb"
version = "0.1.5"  # the driver's own version: bump it when the driver changes (docs/on-demand-drivers.md)
edition.workspace = true
license.workspace = true

[dependencies]
dbine-driver = { path = "../../dbine-driver" }
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
futures.workspace = true
aws-config = { version = "1.12", default-features = false, features = ["rt-tokio", "behavior-version-latest", "default-https-client", "sso"] }
aws-credential-types = "1.3"
aws-sdk-dynamodb = { version = "1.128", default-features = false, features = ["rt-tokio", "behavior-version-latest", "default-https-client"] }

[dev-dependencies]
# Tests talk plain HTTP to local fakes: the default HTTPS client loads the
# OS root certificates and debug-panics where none can be read.
aws-smithy-http-client = { version = "1.4", default-features = false, features = ["default-client"] }
