[package]
name = "dbine-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DBine's TLS certificate checks for the drivers: the chain without the host name (verify-ca) and certificate pinning on first use (the modes that don't verify)"

[dependencies]
dbine-driver = { path = "../dbine-driver" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
sha2 = "0.10"
