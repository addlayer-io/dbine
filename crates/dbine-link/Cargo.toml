[package]
name = "dbine-link"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The channel between DBine and its phone app: pairing by QR code, Noise-encrypted frames, the request types"

[dependencies]
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tokio = { version = "1.40", features = ["net", "io-util", "time"] }
getrandom = "0.3"

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }
