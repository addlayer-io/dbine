[package]
name = "dbine-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DBine AI assistant: finds the AI tools installed on the machine (Ollama, LM Studio, Claude Code, Codex) and streams chats through them, locally"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2 = "0.10"
# llama.cpp's release archives (tar.gz on macOS and Linux, zip on Windows).
tar = "0.4"
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
