# Trivy secret-scan exceptions (used by .github/workflows/security.yml).
# Every entry is a known false positive, with the reason. Trivy can only
# allow a whole file, so keep each path as narrow as possible.
allow-rules:
  - id: bigquery-test-service-account
    description: >
      The unit test in gcp_tests builds a fake service-account JSON around the
      throwaway key in crates/drivers/bigquery/tests/test_key.pem; it holds no
      real credential.
    path: crates/drivers/bigquery/src/gcp\.rs
  - id: postgres-test-entra-token
    description: >
      The unit test entra_claims_say_who_signed_in decodes a made-up,
      unsigned JWT ({"upn":"ana@contoso.com"}); it grants nothing.
    path: crates/drivers/postgres/src/cloud_auth\.rs
  - id: tls-test-material
    description: >
      Throwaway test CA and server keys for the dbine-test-tls-* containers
      (tests/tls/README.md); they only sign certificates for localhost and
      host.docker.internal in tests and protect nothing.
    path: tests/tls/.*\.(key|p12)

